openapi: 3.0.3
info:
  title: SyncWrite API Specification
  version: 1.0.0
  description: API documentation for the SyncWrite Real-Time Collaborative Document Editor backend.
servers:
  - url: http://localhost:5000
    description: Local development server

paths:
  # ==================== AUTHENTICATION (Better Auth) ====================
  /api/auth/sign-in/email:
    post:
      summary: Sign in with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Signed in successfully.

  /api/auth/sign-up/email:
    post:
      summary: Sign up with email and password
      tags:
        - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email:
                  type: string
                password:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: Signed up successfully.

  /api/auth/sign-out:
    post:
      summary: Sign out the current user
      tags:
        - Authentication
      responses:
        '200':
          description: Signed out successfully.

  /api/auth/session:
    get:
      summary: Get the current user session
      tags:
        - Authentication
      responses:
        '200':
          description: Session details retrieved successfully.

  # ==================== DOCUMENT MANAGEMENT & DASHBOARD ====================
  /api/documents:
    get:
      summary: Get user documents (Dashboard)
      description: Returns documents owned by or shared with the authenticated user.
      tags:
        - Documents
      parameters:
        - name: filter
          in: query
          required: false
          schema:
            type: string
            enum: [owned, shared, recent]
      responses:
        '200':
          description: List of documents retrieved successfully.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    properties:
                      documents:
                        type: array
                        items:
                          $ref: '#/components/schemas/Document'
                  - type: object
                    properties:
                      owned:
                        type: array
                        items:
                          $ref: '#/components/schemas/Document'
                      shared:
                        type: array
                        items:
                          $ref: '#/components/schemas/Document'
        '401':
          description: Unauthorized access.

    post:
      summary: Create a new document
      tags:
        - Documents
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
                  default: "Untitled Document"
      responses:
        '201':
          description: Document created successfully.
        '401':
          description: Unauthorized.

  /api/documents/{id}:
    get:
      summary: Open an existing document
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document metadata and content retrieved.
        '403':
          description: Forbidden (insufficient permissions).
        '404':
          description: Document not found.

    patch:
      summary: Rename or update document
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title:
                  type: string
      responses:
        '200':
          description: Document updated successfully.
        '403':
          description: Forbidden (requires Editor role).
        '404':
          description: Document not found.

    delete:
      summary: Delete a document
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Document deleted successfully.
        '403':
          description: Forbidden (only owner can delete).
        '404':
          description: Document not found.

  /api/documents/{id}/duplicate:
    post:
      summary: Duplicate an existing document
      tags:
        - Documents
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Document duplicated successfully.
        '403':
          description: Forbidden.
        '404':
          description: Document not found.

  # ==================== SHARING & PERMISSIONS ====================
  /api/documents/{id}/shares:
    get:
      summary: Get document shares and permissions
      tags:
        - Shares
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of shared users and roles.
        '403':
          description: Forbidden.
        '404':
          description: Document not found.

    post:
      summary: Share document with a user
      tags:
        - Shares
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                role:
                  type: string
                  enum: [VIEWER, COMMENTER, EDITOR]
                permission:
                  type: string
                  enum: [VIEWER, COMMENTER, EDITOR]
      responses:
        '201':
          description: Document shared successfully.
        '400':
          description: Bad Request (Invalid email or cannot share with owner).
        '403':
          description: Forbidden (Only owner can share).
        '404':
          description: Document or user not found.

  /api/documents/{id}/shares/{shareId}:
    patch:
      summary: Update user permission role
      tags:
        - Shares
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [VIEWER, COMMENTER, EDITOR]
                permission:
                  type: string
                  enum: [VIEWER, COMMENTER, EDITOR]
      responses:
        '200':
          description: Role updated successfully.
        '403':
          description: Forbidden (Only owner can manage permissions).
        '404':
          description: Document or share record not found.

    delete:
      summary: Revoke document share
      tags:
        - Shares
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: shareId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Access revoked successfully.
        '403':
          description: Forbidden.
        '404':
          description: Document or share record not found.

  # ==================== COMMENTS ====================
  /api/documents/{id}/comments:
    get:
      summary: Get all comments for a document
      tags:
        - Comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Comments and threads retrieved.
        '403':
          description: Forbidden.
        '404':
          description: Document not found.

    post:
      summary: Add a comment or reply
      tags:
        - Comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                parentId:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Comment created.
        '400':
          description: Invalid comment content or parent.
        '403':
          description: Forbidden (Requires Commenter role).
        '404':
          description: Document not found.

  /api/documents/{id}/comments/{commentId}:
    patch:
      summary: Resolve or update a comment
      tags:
        - Comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                isResolved:
                  type: boolean
                content:
                  type: string
      responses:
        '200':
          description: Comment updated.
        '403':
          description: Forbidden.
        '404':
          description: Comment or document not found.
          
    delete:
      summary: Delete a comment
      tags:
        - Comments
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: commentId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Comment deleted.
        '403':
          description: Forbidden.
        '404':
          description: Comment or document not found.

  # ==================== VERSION HISTORY ====================
  /api/documents/{id}/revisions:
    get:
      summary: View document revision history
      tags:
        - Revisions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of revisions with timestamps and creators.
        '403':
          description: Forbidden.
        '404':
          description: Document not found.
          
    post:
      summary: Create a Document Snapshot / Revision
      tags:
        - Revisions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '201':
          description: Revision created successfully.
        '400':
          description: Document has no content snapshot to save.
        '403':
          description: Forbidden (Requires Editor permissions).
        '404':
          description: Document not found.

  /api/documents/{id}/revisions/{revisionId}/restore:
    post:
      summary: Restore an earlier version of the document
      tags:
        - Revisions
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: revisionId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Document restored to revision state.
        '403':
          description: Forbidden (Requires Editor permissions).
        '404':
          description: Document or revision not found.

  # ==================== NOTIFICATIONS ====================
  /api/notifications:
    get:
      summary: Get all notifications for the authenticated user
      tags:
        - Notifications
      responses:
        '200':
          description: List of notifications retrieved successfully.
        '401':
          description: Unauthorized.
          
  /api/notifications/read-all:
    put:
      summary: Mark all notifications as read
      tags:
        - Notifications
      responses:
        '200':
          description: All notifications marked as read.
        '401':
          description: Unauthorized.

  /api/notifications/{id}/read:
    put:
      summary: Mark a single notification as read
      tags:
        - Notifications
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read.
        '401':
          description: Unauthorized.
        '404':
          description: Notification not found.

components:
  schemas:
    Document:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        content:
          type: string
        ownerId:
          type: string
        createdAt:
          type: string
          format: date-time
        lastModified:
          type: string
          format: date-time
        commentCount:
          type: integer