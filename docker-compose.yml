services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: syncwrite
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d syncwrite"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      # Connect to the 'db' service instead of localhost
      DATABASE_URL: "postgresql://user:password@db:5432/syncwrite"
      BETTER_AUTH_URL: "http://localhost:5000"
    env_file:
      - ./server/.env
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      # Nginx serves on port 80 inside the container, mapping it to 5173 on the host
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata:
